quarkus.mongodb.devservices.enabled=false
# 测试 HTTP 端口独立（本机 8081 常被 service-account dev 占用）
quarkus.http.test-port=18081
manipulation-api/mp-rest/url=http://localhost:18080
manipulation.app-id=test
manipulation.jwt-secret=this is a test key

# 测试不启建索引（避免启动连库）
modbus.index.enabled=false
space.index.enabled=false

# 显式写明：测试进程不跑调度（缺省也是关的，写出来是防止将来改了缺省值就在 CI 里起了一堆线程）
modbus.poll.enabled=false
