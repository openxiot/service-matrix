quarkus.application.name=service-matrix
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins[0]=/.*/
quarkus.http.enable-compression=true

# Native: 包含静态资源和根证书
quarkus.native.resources.includes=META-INF/resources/**,jwt/**

#------------------------------------------------------------
# JWT
#------------------------------------------------------------
mp.jwt.verify.issuer=https://example.com/issuer
mp.jwt.verify.publickey.location=jwt/public.pem

#------------------------------------------------------------
# Manipulation API (同环境内容器调用)
#------------------------------------------------------------
manipulation-api/mp-rest/url=http://service-manipulation
manipulation.app-id=openxiot.matrix
manipulation.jwt-secret=this is a test key

#------------------------------------------------------------
# OpenAPI
#------------------------------------------------------------
quarkus.smallrye-openapi.path=/openapi

#------------------------------------------------------------
# 空间（库 matrix/spaces）
#------------------------------------------------------------
# 启动时建 ancestors 索引（空间树 / 空间图的检索键）。测试进程设 false，免得启动就连库。
space.index.enabled=true

#------------------------------------------------------------
# 自定义看板（库 matrix/web-dashboard-layouts）
#------------------------------------------------------------
# 启动时建 spaceId 唯一索引（一个空间一份布局）。测试进程设 false，免得启动就连库。
dashboard.index.enabled=true

#------------------------------------------------------------
# Modbus 设备点表（库 modbus/device-configs）
#------------------------------------------------------------
modbus.index.enabled=true

#------------------------------------------------------------
# Modbus 采集历史（库 modbus/service-histories 等）
#------------------------------------------------------------
# 死区（仅对数值生效）：0 = 精确比较
modbus.history.deadband=0
# 保活打点周期（秒）：值没变也强制落一条；<= 0 = 关闭
modbus.history.keep-alive-seconds=600
# 明细保留天数：> 0 在 at 上建 TTL 索引（服务端后台删）；<= 0 = 关（并删掉已有的 TTL 索引）。
# **缺省 90 就是开着的**：不设 env 也会生效，部署起来就开始删 90 天前的明细；
# 想先观察就显式设 0。只作用于 service-histories（故障记录与当前值不设，见 Modbus-History.md 第六节）。
# modbus.history.retention-days=90

#------------------------------------------------------------
# Modbus 轮询器（见 Modbus-Service-Poller.md）
#------------------------------------------------------------
# **这里不设 enabled**：同一个 jar 双部署（api N 副本 + poller 1 副本），
# 采不采由部署侧的 env 决定（poll 那份设 MODBUS_POLL_ENABLED=true），缺省是关的。
# 一次发布让多个副本一起采集 = 同一条 RS485 总线上出现重复帧。
#
# modbus.poll.enabled=false                  调度开关（api 副本不设它）
# modbus.poll.concurrency=20                 并发上限（同时几台设备）
# modbus.poll.wakeup-millis=1000             唤醒周期 = 到点任务的最大延迟
# modbus.poll.reconcile-seconds=300          周期对账间隔 = 定义变更生效延迟上限
# modbus.poll.jitter-percent=10              周期抖动（防整点齐发）
# modbus.poll.invoke-timeout-seconds=10      单次采集超时（**必须小于租约**，否则一次慢应答
#                                            会在租约过期后才失败，另一个副本可抢走重发）
# modbus.poll.lease-seconds=60               租约时长（扩容时保证同一任务只有一个副本在跑）
#
# 以上七项都有代码内的缺省值，这里只作说明。