quarkus.application.name=service-site
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins[0]=/.*/
quarkus.http.enable-compression=true

# Native: 包含静态资源和根证书
quarkus.native.resources.includes=META-INF/resources/**,jwt/**

#------------------------------------------------------------
# JWT
#------------------------------------------------------------
mp.jwt.verify.issuer=https://example.com/issuer
mp.jwt.verify.publickey.location=jwt/public.pem

#------------------------------------------------------------
# Manipulation API (同环境内容器调用)
#------------------------------------------------------------
manipulation-api/mp-rest/url=http://service-manipulation
manipulation.app-id=opensite

#------------------------------------------------------------
# OpenAPI
#------------------------------------------------------------
quarkus.smallrye-openapi.path=/openapi